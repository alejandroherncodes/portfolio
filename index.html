<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Alejandro Hernandez — writer, musician, and CS graduate working where music meets the business."
    />
    <title>Alejandro Hernandez</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="style.css?v=20261111-3" />
    <link rel="stylesheet" href="book-covers.css?v=20261111-2" />
    <script type="module" src="script.js?v=20261111-3"></script>
  </head>
  <body>
    <a class="skip-link" href="#writing">Skip to writing</a>
    <header id="top">
      <a class="name" href="#top">A.H.</a>
    </header>
    <main>
      <section
        class="section writing"
        id="writing"
        aria-labelledby="writing-title"
      >
        <div class="section-label">
          <h2 id="writing-title">Writing.</h2>
          <p>(Selected Works)</p>
        </div>
        <div class="section-body" id="writing-cards"></div>
        <noscript>Enable JavaScript to browse writing samples.</noscript>
      </section>
    </main>
    <footer>
      <a href="#top">Alex Hernandez</a>
      <nav class="footer-links" aria-label="Contact and navigation">
        <div class="footer-socials">
        <a class="footer-icon" id="footer-linkedin" href="https://www.linkedin.com/in/alejandrojhern" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile" title="LinkedIn"></a>
        <a class="footer-icon" id="footer-email" href="mailto:alejandrojorgehern@gmail.com" aria-label="Compose email to Alejandro Hernandez" title="Email"></a>
        </div>
      </nav>
    </footer>
    <dialog id="print-reader" aria-label="Article reader">
      <div class="reader-actions">
        <button type="button" id="reader-close" aria-label="Close interactive project">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M6 18 18 6" />
          </svg>
        </button>
      </div>
      <div
        class="reader-stage is-embed"
        tabindex="0"
        aria-label="Interactive project"
      >
        <div class="reader-embed-frame" id="reader-embed-frame">
          <iframe class="reader-embed" id="reader-embed" title="Interactive project" width="1356" height="699" allowfullscreen></iframe>
        </div>
      </div>
      <a
        id="reader-issue"
        class="issue-link"
        target="_blank"
        rel="noopener"
        >View bibliography</a
      >
    </dialog>
    <dialog id="text-reader" aria-label="Article reader">
      <div class="text-reader-toolbar">
        <div class="text-reader-actions">
          <button id="text-reader-print" type="button" aria-haspopup="dialog" hidden>View the print edition ➜</button>
          <a id="text-reader-issue" target="_blank" rel="noopener noreferrer" hidden>Read the full issue ➜</a>
          <button id="text-reader-close" type="button" aria-label="Close article reader">Close ×</button>
        </div>
      </div>
      <div id="text-reader-scroll" tabindex="0" aria-label="Article text">
        <article class="reader-text" id="text-reader-content"></article>
        <a id="text-reader-source" target="_blank" rel="noopener noreferrer" hidden></a>
      </div>
    </dialog>
    <dialog id="print-edition" aria-labelledby="print-edition-title">
      <div class="print-toolbar">
        <div><span class="print-eyebrow">The print edition</span><h2 id="print-edition-title"></h2></div>
        <button type="button" id="print-edition-close">← Back to reading</button>
      </div>
      <div class="print-pages" id="print-pages" tabindex="0" aria-label="Original print pages"></div>
      <p id="print-edition-credit" hidden></p>
    </dialog>
    <dialog id="document-reader" aria-label="Document viewer">
      <div class="print-toolbar">
        <button type="button" id="document-reader-close">Close ×</button>
      </div>
      <iframe id="document-reader-frame" title="Document viewer"></iframe>
    </dialog>
  </body>
</html>
