<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Alejandro Hernandez — writer, musician, and CS graduate working where music meets the business."
    />
    <title>Alejandro Hernandez</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#writing">Skip to writing</a>
    <header id="top">
      <a class="name" href="#top">A.H.</a>
      <nav aria-label="Main navigation">
        <a href="#writing">Work ↙</a>
        <a href="#about">About & contact ↙</a>
      </nav>
    </header>
    <main>
      <section
        class="section writing"
        id="writing"
        aria-labelledby="writing-title"
      >
        <div class="section-label">
          <h2 id="writing-title"><span>01 /</span> Writing</h2>
          <p>Selected works</p>
        </div>
        <div class="section-body" id="writing-cards"></div>
        <noscript>Enable JavaScript to browse writing samples.</noscript>
      </section>
      <section class="section" id="music" aria-labelledby="music-title">
        <div class="section-label">
          <h2 id="music-title"><span>02 /</span> Music</h2>
        </div>
      </section>
      <section class="section" id="games-art" aria-labelledby="games-art-title">
        <div class="section-label">
          <h2 id="games-art-title"><span>03 /</span> Games + Visual Art</h2>
        </div>
      </section>
      <section class="section about" id="about" aria-labelledby="about-title">
        <div class="section-label">
          <h2 id="about-title"><span>04 /</span> About + Contact</h2>
        </div>
      </section>
    </main>
    <footer>
      <a href="#top">Alex Hernandez <span aria-hidden="true">✳</span></a
      ><span>© <span id="year">2026</span></span
      ><a href="#top">Back to top ↑</a>
    </footer>
    <dialog id="print-reader" aria-label="Article reader">
      <div class="reader-actions">
        <button
          type="button"
          id="reader-text-toggle"
          aria-pressed="false"
          aria-controls="reader-text"
        >
          Text only
        </button>
        <button type="button" id="reader-close" aria-label="Close print reader">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M6 18 18 6" />
          </svg>
        </button>
      </div>
      <div
        class="reader-stage"
        tabindex="0"
        aria-label="Print pages"
      >
        <div class="reader-book" id="reader-book"></div>
        <article class="reader-text" id="reader-text" hidden></article>
        <div class="reader-embed-frame" id="reader-embed-frame" hidden>
          <iframe class="reader-embed" id="reader-embed" title="Interactive project" width="1356" height="699" allowfullscreen></iframe>
        </div>
      </div>
      <a
        id="reader-issue"
        class="issue-link"
        href="https://www.tastemakersmag.com/issue/issue84"
        target="_blank"
        rel="noopener"
        hidden
        >Read the full issue</a
      >
      <p id="reader-credit" hidden></p>
    </dialog>
  </body>
</html>
